<script>
  function getHeureEtDate(){
    const aujourdHui = new Date();
    const date = aujourdHui.toLocaleDateString('fr-FR');
    document.getElementById("date").innerText = date;

    const heure = String(aujourdHui.getHours()).padStart(2, '0');
    const minute = String(aujourdHui.getMinutes()).padStart(2, '0');

    document.getElementById('heureJour').textContent = `${heure}H${minute}`;
  }
  getHeureEtDate();
  setInterval(getHeureEtDate,1000);

</script>
