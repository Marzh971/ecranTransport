<style>
/* ==========================================
   1. VARIABLES & CHARTE GRAPHIQUE COOPERL
   ========================================== */
:root {
  /* Charte Graphique Officielle Cooperl */
  --cooperl-blue: #0d5973;            /* Bleu Cooperl (RVB: 13, 89, 115) */
  --cooperl-pink: #f086a4;            /* Rose Cooperl (RVB: 240, 134, 164) */
  --cooperl-dark-blue: #003d52;       /* Bleu Foncé Cooperl (RVB: 0, 61, 82) */

  /* Palette d'Interface Utilisateur */
          /* Bleu profond pour le contraste 062d3b*/ 
  --bg-card: var(--cooperl-dark-blue);/* Fond des cartes et du tableau */
  --bg-dark: #001f2b;                 /* En-têtes et conteneurs sombres */
  --bg-hover: #419EBD;                /* Survol des lignes */

  /* Alternance des Lignes du Tableau */
  --row-even: #07526a;               /* Lignes paires */
  --row-odd: #107194;                  /* Lignes impaires */
  --row-valide: #4091ab;             /* Lignes terminées */

  /* Fonds des Champs (Tes modifications de couleurs intégrées) */
  --bg-input-form: #0d5973;          /* Formulaire latéral */
  --bg-input-modal: #2f647e;         /* Modales */

  /* Accents & Bordures */
  --accent-pink: var(--cooperl-pink);
  --accent-pink-hover: #e66f8e;
  --accent-pink-light: rgba(240, 134, 164, 0.15);
  --accent-red: #e63946;
  --border-color: rgba(20, 97, 125, 0.6);
  --border-focus: var(--cooperl-pink);

  /* Typographie & Ombres */
  --text-color: #ffffff;
  --text-muted: #a1c2d2;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 12px 36px rgba(0, 0, 0, 0.5);

  /* Radius & Layout */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-pill: 50px;
  --header-height: 54px;
  --panel-width: 520px;
}

* {
  box-sizing: border-box;
  scrollbar-width: thin;
  scrollbar-color: var(--border-color) transparent;
}

html { scrollbar-gutter: stable; }

body {
  font-family: 'Source Sans Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: var(--cooperl-blue);
  color: var(--text-color);
  margin: 0;
  padding: 0;
  width: 100%;
}

/* Correctifs FIDS */
html:has(body.page-fids),
body.page-fids {
  width: 100% !important;
  height: 100vh !important;
  overflow: hidden !important;
  scrollbar-gutter: auto !important;
}

body.page-fids .fids-legende {
  width: 100%;
  left: 0;
  right: 0;
}

.hidden { display: none !important; }
.block { display: block; }

/* Scrollbar Personnalisée */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-dark); }
::-webkit-scrollbar-thumb {
  background: var(--border-color);
  border-radius: var(--radius-pill);
}
::-webkit-scrollbar-thumb:hover { background: var(--accent-pink); }

/* Titres */
h1, h2, h3 {
  color: var(--accent-pink);
  margin: 0;
  font-weight: 700;
  letter-spacing: 0.3px;
}
h2 { text-align: center; }

.cooperl_pink { color: var(--accent-pink); }
.cooper_col_back { background-color: var(--bg-card); }


/* ==========================================
   2. NAVBAR
   ========================================== */
.navbar-cooperl {
  background-color: var(--bg-card);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: var(--header-height);
  color: var(--text-color);
  box-shadow: var(--shadow-md);
  position: sticky;
  top: 0;
  z-index: 100;
  width: 100%;
  border-bottom: 1px solid var(--border-color);
}

.nav-logo img {
  height: 36px;
  width: auto;
  object-fit: contain;
}

.nav-center,
.navbar-cooperl > div:nth-child(2) {
  display: flex;
  gap: 180px;
  align-items: center;
}

#nav-ancre { display: flex; gap: 140px; }

.navbar-cooperl .nav-link {
  color: var(--text-color);
  text-decoration: none;
  background: transparent;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  transition: all 0.2s ease;
}

.navbar-cooperl .nav-link:hover {
  color: var(--accent-pink);
  background-color: var(--accent-pink-light);
}

.navbar-cooperl .nav-link.active {
  color: var(--accent-pink);
  background-color: var(--bg-dark);
}

.nav-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  white-space: nowrap;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.25;
  color: var(--text-color);
  min-width: 90px;
}

.nav-right p {
  margin: 0;
  padding: 0;
  text-align: right;
}

.nav-right #heureJour {
  color: var(--accent-pink);
  font-weight: 700;
}


/* ==========================================
   3. BARRE DE FILTRES
   ========================================== */
.ligne-filtre {
  display: flex;
  align-items: flex-end;
  gap: 16px;
  background-color: var(--bg-card);
  padding: 12px 18px;
  border-radius: var(--radius-lg);
  margin: 15px 0;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
  flex-wrap: wrap;
}

.groupe-filtre {
  display: flex;
  align-items: flex-end;
  gap: 12px;
  background-color: var(--bg-dark);
  border: 1px solid var(--border-color);
  padding: 8px 14px;
  border-radius: var(--radius-md);
}

.separateur-filtre {
  width: 1px;
  height: 32px;
  background-color: var(--border-color);
  margin: 0 4px;
  align-self: center;
}

.filtre { display: flex; flex-direction: column; gap: 6px; }
.filtre label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #ffffff;
  text-align: center;
}

/* Application de tes paramètres de filtres (largeur 170px et couleur row-valide) */
.filtre input {
  background-color: var(--cooperl-blue);
  border: 1px solid var(--border-color);
  color: var(--text-color);
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  outline: none;
  width: 170px;
  text-align: center;
  height: 36px;
  transition: all 0.2s ease;
}

.filtre input:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px rgba(240, 134, 164, 0.2);
}

.filtre input::placeholder { color: var(--text-muted); }

.btn-filtrer-date {
  background-color: var(--accent-pink);
  border-radius: var(--radius-md);
  color: var(--text-color);
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  height: 36px;
  padding: 0 20px;
  border: none;
  transition: all 0.2s ease;
}

.btn-filtrer-date:hover {
  background-color: var(--accent-pink-hover);
  transform: translateY(-1px);
}

.filtre-right {
  margin-left: auto;
  display: flex;
  gap: 10px;
  align-items: center;
  height: 36px;
}

.toggle-masquer {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
  font-size: 13px;
  font-weight: 600;
  color: #ffffff;
}

.toggle-masquer input[type="checkbox"] { display: none; }

.toggle-masquer .slider {
  width: 44px;
  height: 24px;
  background-color: var(--bg-dark);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-pill);
  position: relative;
  transition: all 0.25s ease;
}

.toggle-masquer .slider::before {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 18px;
  height: 18px;
  background-color: var(--text-color);
  border-radius: 50%;
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: var(--shadow-sm);
}

.toggle-masquer input[type="checkbox"]:checked + .slider {
  background-color: var(--accent-pink);
  border-color: var(--accent-pink);
}

.toggle-masquer input[type="checkbox"]:checked + .slider::before {
  transform: translateX(20px);
}


/* ==========================================
   4. TABLEAU PRINCIPAL
   ========================================== */
.conteneur-dashboard {
  display: flex;
  align-items: flex-start;
  gap: 24px;
  padding: 0 20px 20px 20px;
  width: 100%;
}

.zone-tableau {
  flex: 1;
  min-width: 0;
  transition: max-width 0.25s ease-in-out;
}

.conteneur-dashboard.form-ouvert .zone-tableau {
  max-width: calc(100% - (var(--panel-width) + 24px));
}

table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  text-align: center;
  background-color: var(--bg-card);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-md);
  clip-path: inset(0 0 0 0 round var(--radius-lg));
}

th {
  position: sticky;
  top: var(--header-height);
  z-index: 20;
  background-color: var(--bg-dark);
  padding: 12px 10px;
  color: var(--accent-pink);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  border-bottom: 2px solid var(--border-color);
}

td {
  padding: 10px;
  font-size: 13px;
  border-bottom: 1px solid rgba(20, 97, 125, 0.3);
  transition: background-color 0.15s ease;
}

tbody tr:last-child td { border-bottom: none; }

/* Alternance des lignes */
tbody tr.trEnregistrement:nth-child(even) td {
  background-color: var(--row-even);
}

tbody tr.trEnregistrement:nth-child(odd) td {
  background-color: var(--row-odd);
}

/* Lignes terminées */
tbody tr.trEnregistrement.enregistrement-valide td {
  background-color: var(--row-valide);
  color: #ffffff;
  font-style: italic;
  font-weight: 600;
}

tbody tr.trEnregistrement:hover td {
  background-color: var(--bg-hover);
  cursor: pointer;
}

tbody tr.trEnregistrement.ligne-selectionnee td {
  background-color: rgba(240, 134, 164, 0.35);
  font-weight: 600;
}

tbody tr.trEnregistrement.ligne-selectionnee td:first-child {
  border-left: 5px solid var(--accent-pink);
}


/* ==========================================
   5. PANNEAU LATÉRAL & FORMULAIRE
   ========================================== */
.details-enregistrement {
  position: fixed;
  top: 70px;
  bottom: 20px;
  right: 20px;
  width: var(--panel-width);
  z-index: 500;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 18px 22px;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border-color);
  background-color: var(--bg-card);
}

.form-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border-color);
}

.form-header h2 { font-size: 18px; width: 100%; }

.modal-close-btn {
  height: 30px;
  width: 30px;
  border-radius: var(--radius-pill);
  background-color: var(--bg-dark);
  border: 1px solid var(--border-color);
  color: var(--text-color);
  font-size: 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}

.modal-close-btn:hover {
  background-color: var(--accent-pink);
  border-color: var(--accent-pink);
  color: var(--text-color);
}

.form-ligne-1, .form-ligne-2, .form-ligne-3 {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  margin-bottom: 12px;
}

.form-ligne-1 > *, .form-ligne-2 > *, .form-ligne-3 > * { flex: 1; }

.form-colonne {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 12px;
  width: 100%;
}

.details-enregistrement label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
  user-select: none;
}

.details-enregistrement label i,
.details-enregistrement label svg {
  font-size: 16px;
  width: 18px;
  height: 18px;
  color: #ffffff;
}

.form-section-titre,
.form-section-titre span {
  font-size: 12px;
  font-weight: 700;
  color: var(--accent-pink);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 6px;
  text-align: left;
}

.details-enregistrement input[type="text"],
.details-enregistrement input[type="date"],
.details-enregistrement input[type="time"],
.details-enregistrement input[type="number"],
.details-enregistrement select {
  height: 34px;
  width: 100%;
  background-color: var(--bg-input-form);
  border: 1px solid var(--border-color);
  color: #ffffff;
  padding: 0 10px;
  border-radius: var(--radius-md);
  font-size: 12px;
  text-align: center;
  outline: none;
  transition: all 0.2s ease;
  color-scheme: dark;
}

.details-enregistrement select {
  padding-right: 28px;
  appearance: none;
  cursor: pointer;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat: no-repeat;
  background-position: right 8px center;
  background-size: 16px;
}

.details-enregistrement input:focus,
.details-enregistrement select:focus,
.details-enregistrement textarea:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px rgba(240, 134, 164, 0.25);
}

.details-enregistrement textarea {
  width: 100%;
  background-color: var(--bg-input-form);
  border: 1px solid var(--border-color);
  color: #ffffff;
  padding: 8px 10px;
  border-radius: var(--radius-md);
  font-size: 12px;
  resize: vertical;
  min-height: 65px;
  outline: none;
}

.details-enregistrement textarea::placeholder,
.details-enregistrement input::placeholder {
  color: rgba(255, 255, 255, 0.7);
  opacity: 1;
}

.details-enregistrement hr {
  border: 0;
  border-top: 1px solid var(--border-color);
  margin: 12px 0;
}

.form-ligne-temp,
.form-ligne-lavage,
.form-ligne-arrimage {
  display: flex;
  flex-direction: row;
  align-items: flex-end;
  gap: 10px;
  width: 100%;
  margin-bottom: 8px;
}

.form-ligne-temp .bloc-champ:first-child {
  width: 75px;
  flex: none;
}

.form-ligne-temp .bloc-champ,
.form-ligne-lavage .bloc-champ,
.form-ligne-arrimage .bloc-champ {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}

.form-ligne-temp button,
.form-ligne-lavage button,
.form-ligne-arrimage button {
  height: 34px;
  padding: 0 16px;
  font-size: 12px;
  white-space: nowrap;
  flex-shrink: 0;
}

input[type="checkbox"] {
  appearance: none;
  width: 18px;
  height: 18px;
  background-color: var(--bg-input-form);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  cursor: pointer;
  position: relative;
  vertical-align: middle;
  transition: all 0.2s ease;
}

input[type="checkbox"]:hover { border-color: var(--accent-pink); }
input[type="checkbox"]:checked {
  background-color: var(--accent-pink);
  border-color: var(--accent-pink);
}

input[type="checkbox"]:checked::after {
  content: '';
  position: absolute;
  left: 5px;
  top: 1px;
  width: 4px;
  height: 9px;
  border: solid var(--text-color);
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

/* ==========================================
   STYLISATION CORRIGÉE DU BLOC ANOMALIES
   ========================================== */


/* Conteneur de la ligne : Alignement vertical au centre pour tous les éléments */
.form-ligne-anomalies {
  background-color: #58818f;
  border: 1px solid var(--border-color, rgba(20, 97, 125, 0.6));
  border-radius: var(--radius-md, 8px);
  padding: 8px 12px;
  display: flex;
  align-items: center; /* ALIGNEMENT CENTRAL VERTICAL */
  justify-content: space-between;
  gap: 10px;
  box-shadow: var(--shadow-sm, 0 2px 8px rgba(0, 0, 0, 0.2));
  width: 100%;
  box-sizing: border-box;
}

/* Badge rose : hauteur et centrage parfaitement calés */
.form-ligne-anomalies > p {
  margin: 0;
  font-weight: 700;
  font-size: 11px;
  color: #ffffff;
  background-color: var(--accent-pink, #f086a4);
  padding: 6px 10px;
  border-radius: var(--radius-pill, 50px);
  width: auto;
  min-width: 90px;
  max-width: 120px;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  /* Décalage vers le bas pour s'aligner sur la hauteur des inputs sous leurs labels */
  margin-top: 14px; 
}

/* Bloc contenant Label + Input */
.bloc-input-anomalie {
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex: 1;
  min-width: 0;
}

.bloc-input-anomalie label {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  color: #ffffff;
  text-align: center;
  white-space: nowrap;
}

.bloc-input-anomalie input[type="datetime-local"] {
  height: 30px;
  width: 100%;
  background-color: var(--bg-input-form, #0d5973);
  border: 1px solid var(--border-color, rgba(20, 97, 125, 0.6));
  color: #ffffff;
  padding: 0 4px;
  border-radius: var(--radius-md, 6px);
  font-size: 10px;
  text-align: center;
  outline: none;
  color-scheme: dark;
  box-sizing: border-box;
}

/* Bouton X : centré sur la hauteur des inputs */
.form-ligne-anomalies .modal-close-btn {
  height: 26px;
  width: 26px;
  min-width: 26px;
  border-radius: 50%;
  background-color: transparent;
  border: 1px solid var(--border-color, rgba(20, 97, 125, 0.6));
  color: #ffffff;
  font-size: 12px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  flex-shrink: 0;
  /* Même décalage vers le bas que le badge pour s'aligner exactement sur les inputs */
  margin-top: 14px; 
  transition: all 0.2s ease;
}

.form-ligne-anomalies .modal-close-btn:hover {
  background-color: var(--accent-red, #e63946);
  border-color: var(--accent-red, #e63946);
  color: #ffffff;
}


/* ==========================================
   6. BOUTONS & BOUTON FLÈCHE
   ========================================== */
button {
  background-color: var(--accent-pink);
  border-radius: var(--radius-md);
  border: none;
  color: var(--text-color);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  height: 36px;
  padding: 0 16px;
  transition: all 0.2s ease;
  user-select: none;
  box-shadow: var(--shadow-sm);
}

button:hover {
  background-color: var(--accent-pink-hover);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.btn1 {
  background-color: var(--bg-dark);
  border-radius: var(--radius-md);
  color: var(--text-color);
  border: 1px solid var(--border-color);
}

.btn1:hover {
  background-color: var(--bg-hover);
  border-color: var(--accent-pink);
}

.btn-pink-soft {
  background-color: var(--accent-pink);
  color: var(--text-color);
}

.form-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: auto;
  padding-top: 14px;
  border-top: 1px solid var(--border-color);
}

.form-footer .btn-supprimer {
  background: transparent;
  color: var(--text-muted);
  font-size: 18px;
  padding: 6px;
  box-shadow: none;
}

.form-footer .btn-supprimer:hover {
  color: var(--accent-red);
  transform: scale(1.15);
}

.btn-nouveau-rond {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 999;
  width: 56px;
  height: 56px;
  border-radius: var(--radius-pill);
  background-color: var(--accent-pink);
  color: var(--text-color);
  border: none;
  font-size: 30px;
  font-weight: 300;
  box-shadow: var(--shadow-lg);
  transition: all 0.25s ease;
}

.btn-nouveau-rond:hover {
  background-color: var(--accent-pink-hover);
  transform: scale(1.08);
}

#btn-fleche {
  position: fixed;
  bottom: 24px;
  right: 90px;
  z-index: 998;
  width: 56px;
  height: 56px;
  border-radius: var(--radius-pill);
  background-color: var(--bg-dark);
  border: 2px solid var(--border-color);
  color: var(--text-color);
  box-shadow: var(--shadow-md);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s ease;
}

#btn-fleche:hover {
  background-color: var(--accent-red);
  border-color: var(--text-color);
  transform: translateY(-3px);
}

}

   ========================================== */
.modal {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background-color: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(6px);
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-window {
  background-color: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  width: 90%;
  max-width: 650px;
  max-height: 85vh;
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: modalApparition 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.modal-header {
  padding: 14px 20px;
  background-color: var(--bg-dark);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-header h3 {

  font-weight: 700;
  text-align: center;
  width: 100%;
}

.modal-onglet {
  background-color: var(--bg-dark);
  border-bottom: 1px solid var(--border-color);
}

.modal-onglet ul {
  display: flex;
  list-style: none;
  padding: 0 20px;
  margin: 0;
  gap: 12px;
}

.modal-onglet .onglet {
  background: transparent;
  border: none;
  padding: 12px 16px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  position: relative;
}

.modal-onglet .onglet.actif { color: var(--accent-pink); }

.modal-onglet .onglet.actif::after {
  content: "";
  position: absolute;
  bottom: 0; left: 0;
  width: 100%; height: 3px;
  background-color: var(--accent-pink);
  border-radius: 3px 3px 0 0;
}

.modal-body {
  padding: 20px;
  overflow-y: auto;
  text-align: center;
}

.modal-body p,
.modal-body label,
.modal-body span {
  text-align: center;
}

.modal-body input[type="text"],
.modal-body input[type="number"],
.modal-body select {
  height: 38px;
  width: 100%;
  background-color: var(--bg-input-modal);
  border: 1px solid var(--border-color);
  color: var(--text-color);
  padding: 0 12px;
  border-radius: var(--radius-md);
  font-size: 13px;
  outline: none;
  box-sizing: border-box;
  text-align: center;
}

.modal-body select {
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f086a4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat: no-repeat;
  background-position: right 10px center;
  background-size: 16px;
  padding-right: 32px;
}

.modal-body input:focus,
.modal-body select:focus {

  box-shadow: 0 0 0 3px rgba(240, 134, 164, 0.25);
